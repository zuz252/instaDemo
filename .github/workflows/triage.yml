name: Auto-triage Issues

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: "!contains(github.event.issue.body, '@claude') && !contains(github.event.issue.title, '@claude')"
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Triage with Claude
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const https = require('https');

            const issue = context.payload.issue;
            const prompt = `You are a GitHub issue triager for a solo developer. Respond with a JSON object only, no markdown code fences, no prose. Two fields:
            - "labels": array of strings, only from: ["bug", "enhancement", "chore", "documentation", "priority: high", "priority: low"]
            - "comment": one concise sentence explaining the triage

            Title: ${issue.title}
            Body: ${issue.body || '(no description)'}`;

            const requestData = JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 256,
              messages: [{ role: 'user', content: prompt }]
            });

            const response = await new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'api.anthropic.com',
                path: '/v1/messages',
                method: 'POST',
                headers: {
                  'x-api-key': process.env.ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
                  'content-length': Buffer.byteLength(requestData)
                }
              }, (res) => {
                let body = '';
                res.on('data', chunk => body += chunk);
                res.on('end', () => resolve(JSON.parse(body)));
              });
              req.on('error', reject);
              req.write(requestData);
              req.end();
            });

            let text = response.content[0].text.trim();
            // Strip leading/trailing markdown code fences if present
            if (text.startsWith('```')) {
              text = text.replace(/^```[a-zA-Z]*/, '').trim();
              const lastFence = text.lastIndexOf('```');
              if (lastFence > -1) text = text.substring(0, lastFence).trim();
            }

            let result;
            try {
              result = JSON.parse(text);
            } catch (e) {
              core.warning(`Could not parse JSON: ${text}`);
              return;
            }

            for (const label of (result.labels || [])) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: [label]
                });
              } catch (e) {
                core.info(`Skipping label "${label}": ${e.message}`);
              }
            }

            if (result.comment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `🤖 **Auto-triage:** ${result.comment}`
              });
            }
